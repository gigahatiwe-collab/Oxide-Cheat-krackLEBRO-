<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM HACKED</title>
<style>
  body { 
    background-color: #000; 
    color: #0f0; 
    font-family: monospace; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    height: 100vh; 
    margin: 0; 
    overflow: hidden; 
  }
  pre { 
    font-size: 10px; 
    line-height: 1.2; 
    text-align: center; 
    text-shadow: 0 0 5px #0f0;
    animation: pulse 0.5s infinite alternate;
  }
  .red { 
    color: #f00; 
    text-shadow: 0 0 15px #f00;
    font-size: 24px;
    font-weight: bold;
    margin-top: 20px;
    display: none;
    text-align: center;
    animation: shake 0.5s infinite;
  }
  #text {
    margin-top: 20px;
    font-size: 16px;
    text-align: center;
  }
  @keyframes pulse {
    from { opacity: 0.8; }
    to { opacity: 1; }
  }
  @keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -2px) rotate(-1deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    30% { transform: translate(3px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 2px) rotate(-1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    70% { transform: translate(3px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(1px, 2px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }
</style>
</head>
<body>

<pre id="mask">
       .---.
      /     \
     | () () |
      \  ^  /
       |||||
       |||||
       |||||
</pre>

<div id="text">Инициализация...</div>
<div id="warning" class="red">ТЕБЯ ВЗЛОМАЛИ!</div>

<script>
  const textEl = document.getElementById('text');
  const warningEl = document.getElementById('warning');
  
  const steps = [
    "Обход защиты...",
    "Поиск уязвимостей...",
    "Доступ к системе...",
    "Скачивание данных...",
    "Готово."
  ];

  let i = 0;
  const interval = setInterval(() => {
    if (i < steps.length) {
      textEl.innerText = steps[i];
      i++;
    } else {
      clearInterval(interval);
      textEl.style.display = 'none';
      warningEl.style.display = 'block';
    }
  }, 800); 

  document.body.addEventListener('click', () => {
    document.getElementById('mask').style.color = '#f00';
    document.getElementById('mask').style.textShadow = '0 0 10px #f00';
    setTimeout(() => {
      alert("Шутка! Твои данные в безопасности 😉");
    }, 100);
  });
</script>

</body>
</html>
